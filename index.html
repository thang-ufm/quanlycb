<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý cán bộ - Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
        }
      }
    </script>
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <div id="login-container" class="login-container">
        <h2>Đăng Nhập Quản Lý Cán Bộ</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Nhập email...">
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu...">
            </div>
            <button type="submit">Đăng nhập</button>
        </form>
        <div id="login-status"></div>
    </div>

    <div id="dashboard-container" class="dashboard-container" style="display: none;">
        <div class="dashboard-header">
            <h2>Hệ Thống Quản Lý Cán Bộ</h2>
            <div class="user-info">
                <span>Xin chào, <span id="user-email"></span></span>
                <button id="btn-logout" class="btn-logout">Đăng xuất</button>
            </div>
        </div>
        <div class="dashboard-content">
            <div class="form-section">
                <h3>Thêm Cán Bộ Mới</h3>
                <form id="add-staff-form">
                    <div class="input-group">
                        <label for="ma_cb">Mã cán bộ</label>
                        <input type="text" id="ma_cb" required placeholder="Nhập mã cán bộ...">
                    </div>
                    <div class="input-group">
                        <label for="ho_ten">Họ và tên</label>
                        <input type="text" id="ho_ten" required placeholder="Nhập họ và tên...">
                    </div>
                    <div class="input-group">
                        <label for="chuc_vu">Chức vụ</label>
                        <input type="text" id="chuc_vu" required placeholder="Nhập chức vụ...">
                    </div>
                    <div class="input-group">
                        <label for="phong_ban">Phòng ban / Đơn vị</label>
                        <input type="text" id="phong_ban" required placeholder="Nhập phòng ban...">
                    </div>
                    <div class="input-group">
                        <label for="sdt">Số điện thoại</label>
                        <input type="tel" id="sdt" required placeholder="Nhập số điện thoại...">
                    </div>
                    <button type="submit" class="btn-add">Thêm cán bộ</button>
                </form>
            </div>
            <div class="table-section">
                <h3>Danh Sách Cán Bộ</h3>
                <table id="staff-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Mã CB</th>
                            <th>Họ và tên</th>
                            <th>Chức vụ</th>
                            <th>Phòng ban</th>
                            <th>Số điện thoại</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
