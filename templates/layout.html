<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Công Việc</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans leading-normal tracking-normal flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-blue-800 p-4 shadow-md text-white">
        <div class="container mx-auto flex flex-wrap items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fas fa-tasks text-2xl"></i>
                <span class="font-bold text-xl tracking-tight">QLCV - Phân hiệu UFM Quảng Ngãi</span>
            </div>

            <div class="flex items-center space-x-4">
                <span class="text-sm">
                    <i class="fas fa-user-circle mr-1"></i>
                    {% if current_user %}
                        {{ current_user.full_name }} ({{ current_user.role }})
                    {% else %}
                        Khách
                    {% endif %}
                </span>
                <button class="bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded text-sm transition duration-300">
                    Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto mt-6 px-4 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-4 mt-8">
        <div class="container mx-auto text-center text-sm">
            &copy; 2024 Phân hiệu Trường Đại học Tài chính - Marketing tại tỉnh Quảng Ngãi. All rights reserved.
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="/static/script.js"></script>
</body>
</html>
